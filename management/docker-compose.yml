services:

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer/portainer_data:/data
    networks:
      homelab:
        ipv4_address: 172.16.1.2

networks:
  homelab:
    name: homelab
    external: true

volumes:
  portainer_data:
